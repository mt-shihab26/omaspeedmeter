name: Release

# Triggered by Format/Validate finishing rather than by push directly, so a
# release is only ever cut from a commit that has been auto-formatted and
# has passed qmllint/manifest validation.
on:
  workflow_run:
    workflows: [Format, Validate]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Format and Validate typically finish within seconds of each other, so
    # both of their completions can trigger this job for the same commit at
    # nearly the same time. Without this, both runs can pass the "already
    # released?" check before either has created the tag, and both then hit
    # gh release create — the second one fails with HTTP 422 (tag_name
    # already exists). Serializing by commit means the second run only
    # starts once the first has finished, by which point its check
    # correctly sees the tag and skips.
    concurrency:
      group: release-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      # Format and Validate both run on every push and each complete
      # independently, re-triggering this workflow separately — so only
      # proceed once BOTH have a successful run recorded for this exact
      # commit, whichever one's completion happened to trigger this run.
      - name: Check Format and Validate both succeeded for this commit
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="${{ github.event.workflow_run.head_sha }}"
          ready=true
          for wf in Format Validate; do
            run=$(gh run list --repo "${{ github.repository }}" --workflow "$wf" --branch main \
              --json headSha,status,conclusion --jq "[.[] | select(.headSha == \"$sha\")][0]")
            status=$(echo "$run" | jq -r '.status // empty')
            conclusion=$(echo "$run" | jq -r '.conclusion // empty')
            [ "$status" = "completed" ] && [ "$conclusion" = "success" ] || ready=false
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Read version from manifest.json
        if: steps.gate.outputs.ready == 'true'
        id: version
        run: echo "value=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      # manifest.json can change without bumping the version (e.g. a schema
      # label tweak), and this workflow can also re-run on the same commit —
      # a pre-existing tag means this version was already released.
      - name: Check whether this version was already released
        if: steps.gate.outputs.ready == 'true'
        id: check
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.version.outputs.value }}" >/dev/null; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi

      # Pulls the body between this version's `## [x.y.z]` heading and the
      # next `## [` heading (or end of file) out of CHANGELOG.md, so the
      # release notes are the changelog entry the version bump shipped with.
      - name: Extract changelog section
        if: steps.gate.outputs.ready == 'true' && steps.check.outputs.already_released == 'false'
        run: |
          awk -v ver="${{ steps.version.outputs.value }}" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found = 1 }
              next
            }
            found { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "::error::No CHANGELOG.md entry found for version ${{ steps.version.outputs.value }}" >&2
            exit 1
          fi

      # Mirrors GitHub's own auto-generated notes footer: a compare link
      # against the highest existing version tag, or (on the very first
      # release, when there's nothing to compare against) a link to the
      # full commit history up to this tag instead.
      - name: Append full changelog link
        if: steps.gate.outputs.ready == 'true' && steps.check.outputs.already_released == 'false'
        run: |
          current_tag="v${{ steps.version.outputs.value }}"
          prev_tag=$(git tag --list 'v*' | grep -v "^$current_tag\$" | sort -V | tail -1)

          echo "" >> release_notes.md
          if [ -n "$prev_tag" ]; then
            echo "**Full Changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/$prev_tag...$current_tag" >> release_notes.md
          else
            echo "**Full Changelog**: ${{ github.server_url }}/${{ github.repository }}/commits/$current_tag" >> release_notes.md
          fi

      # Belt-and-braces alongside the concurrency group above: if this
      # version still somehow got released between the check step and here
      # (or the tag was created some other way), GitHub's "already exists"
      # response isn't a failure worth failing the job over — anything else
      # still is.
      - name: Create GitHub release
        if: steps.gate.outputs.ready == 'true' && steps.check.outputs.already_released == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! output=$(gh release create "v${{ steps.version.outputs.value }}" \
            --title "v${{ steps.version.outputs.value }}" \
            --notes-file release_notes.md \
            --target "${{ github.event.workflow_run.head_sha }}" 2>&1); then
            if echo "$output" | grep -qi "already_exists\|already exists"; then
              echo "v${{ steps.version.outputs.value }} was already released — nothing to do."
              exit 0
            fi
            echo "$output" >&2
            exit 1
          fi
          echo "$output"
